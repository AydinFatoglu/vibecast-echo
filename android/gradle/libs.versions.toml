[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
appcompat = "1.8.0"
jna = "5.19.1"
ktlint = "14.2.0"
detekt = "1.23.8"
# Media3 is the on-device player: native decoding, no browser origin rules, and
# a DASH extractor that reads the receiver's own manifests directly.
media3 = "1.8.0"
# WebSocket client for the player bridge.
okhttp = "4.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
# Kotlin compilation comes from AGP's built-in Kotlin support; the separate
# org.jetbrains.kotlin.android plugin was removed in AGP 9.
android-application = { id = "com.android.application", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
